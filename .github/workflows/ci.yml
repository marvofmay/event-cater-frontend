name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          API_INTERNAL_URL: http://service-company:80
          NEXT_PUBLIC_MERCURE_URL: https://eventcater.pl/.well-known/mercure
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build -- --webpack

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: eventcater-production
      cancel-in-progress: false
    steps:
      - name: Deploy to DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            # Refresh deploy.sh on disk before exec (script self-reexecs after pull too).
            cd /home/marcin/apps/eventcater/frontend
            git fetch --all --prune
            git checkout -f main
            git reset --hard origin/main
            bash deploy/scripts/deploy.sh

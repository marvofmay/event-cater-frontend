# Nginx site for EventCater
# Install: bash frontend/deploy/scripts/install-nginx-site.sh
# TLS:     sudo certbot --nginx -d eventcater.pl -d www.eventcater.pl

upstream eventcater_frontend {
    server 127.0.0.1:3010;
    keepalive 16;
}

upstream eventcater_mercure {
    server 127.0.0.1:3011;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name eventcater.pl www.eventcater.pl;

    client_max_body_size 110m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /.well-known/mercure {
        proxy_pass http://eventcater_mercure;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 24h;
    }

    location / {
        proxy_pass http://eventcater_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
